<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play</title>
  <meta name="description" content="Two small browser games: Pi Flight, a flight through the digits of π, and Starship, a space shooter.">
  <meta name="theme-color" content="#05060b">
  <link rel="icon" type="image/svg+xml" href="../pro/images/favicon-pro.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="hub.css?v=5">
</head>
<body>
  <!-- Same brand as Pro Mode's top bar, in the same place; it links to Pro Mode -->

    <a class="topnav__brand" href="../pro/" aria-label="Hoang Anh (Benjamin) Nguyen, Pro Mode">

        <div class="card__body">
          <h2>Pi Flight</h2>
          <p>Fly π through its own digits. One button. How many decimal places can you reach?</p>

      </a>

      <a class="card card--starship" href="starship/">

          </defs>
          <rect width="320" height="200" fill="url(#sky)"/><rect width="320" height="200" fill="url(#neb)"/>
          <g fill="#fff"><circle cx="22" cy="30" r="1"/><circle cx="70" cy="150" r="1.3"/><circle cx="118" cy="22" r="0.9"/><circle cx="150" cy="96" r="1.1"/><circle cx="201" cy="170" r="1"/><circle cx="244" cy="38" r="1.4"/><circle cx="286" cy="120" r="1"/><circle cx="300" cy="18" r="0.8"/><circle cx="44" cy="92" r="0.8"/><circle cx="262" cy="182" r="0.9"/></g>
          <!-- three alien pods -->
          <use href="#pod" transform="translate(96 44)"/><use href="#pod" transform="translate(160 36)"/><use href="#pod" transform="translate(224 44)"/>
          <use href="#pod" transform="translate(128 78)"/><use href="#pod" transform="translate(192 78)"/>
          <!-- enemy shots -->
          <g fill="#ff7a55"><circle cx="128" cy="108" r="4"/><circle cx="205" cy="124" r="4"/></g>

          <g transform="translate(160 164)">

            <path d="M0-6-26 16-22 21-6 14 6 14 22 21 26 16z" fill="#4a6fd6" stroke="#cfe0ff" stroke-width="1.5"/>
            <path d="M0-26 8-4 9 16-9 16-8-4z" fill="#e8eeff" stroke="#fff" stroke-width="1.2"/>
            <path d="M0-15 4-3 0 4-4-3z" fill="#39c6ff"/>
          </g>
        </svg>
        <div class="card__body">
          <h2>Starship</h2>
          <p>A space shooter with alien craft, jets and bosses. 8 sectors, 48 waves.</p>
          <p class="card__best" id="best-starship"></p>
          <span class="card__go">Play</span>
        </div>
      </a>
    </div>
  </main>

  <script>
  // show each game's best result, saved on this device by the games themselves
  (function () {
    function read(key) { try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { return {}; } }
    var s = read("starship-save-v1"), p = read("pi-flight-v1");
    if (s.best) document.getElementById("best-starship").textContent = "Your best: " + Number(s.best).toLocaleString() + (s.sector ? ", reached sector " + (s.sector + 1) : "");
    if (p.best) document.getElementById("best-pi").textContent = "Your best: " + p.best + " decimal places";
  })();
  </script>
</body>
</html>
